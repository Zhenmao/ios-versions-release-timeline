<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS Versions Timeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght@6..144,25..151,1..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <article>
        <div class="header">
          <hgroup>
            <h1>iOS Versions</h1>
            <p>Release Timeline</p>
          </hgroup>

          <div class="legend">
            <div></div>
            <div class="legend__title"
              >iOS version <span>(Latest version)</span></div
            >
            <div class="legend__label">Release date</div>
            <div class="legend__swatch"></div>
            <div class="legend__label">Latest update date</div>
          </div>
        </div>

        <figure id="chart"></figure>

        <footer>
          <p
            >Source:
            <a
              href="https://www.macworld.com/article/1659017/ios-versions-list.html"
              target="_blank"
              >iOS versions: Explore every iOS version from day one to today</a
            >
            accessed on October 5, 2026.</p
          >
        </footer>
      </article>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
